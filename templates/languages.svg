<svg id="gh-dark-mode-only" width="400" height="340" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">Languages by file size</title>
<style>
svg { --paper: #fcfafb; --ink: #39323c; --muted: #766e79; --accent: #a97793; --border: #ded5dd; --rule: #eee8ed; }
#gh-dark-mode-only:target { --paper: #211e25; --ink: #eee7ed; --muted: #b5a9b9; --accent: #c399b5; --border: #4a3c4b; --rule: #352d39; }
text { font-family: Arial, sans-serif; }
.ink { fill: var(--ink); }
.muted { fill: var(--muted); }
.heading { font: 600 17px Helvetica, Arial, sans-serif; }
.value { font: 500 17px Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
</style>
<rect x="6" y="6" width="388" height="328" rx="6" fill="var(--paper)" stroke="var(--border)"/>
<text x="26" y="43" class="heading ink">languages</text>
<text x="26" y="64" font-size="11" class="muted">by file size</text>
<path d="M359 28h4v4h4v4h-4v4h-4v-4h-4v-4h4z" fill="var(--accent)"/>
<foreignObject x="26" y="87" width="348" height="230">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
.progress { display: flex; height: 6px; overflow: hidden; border-radius: 2px; margin-bottom: 19px; }
.progress-item { min-width: 0; opacity: .8; }
ul { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; row-gap: 4px; list-style: none; padding: 0; margin: 0; }
li { display: flex; align-items: center; min-width: 0; height: 10px; font: 9px Arial, sans-serif; color: var(--ink); }
.octicon { width: 5px; height: 5px; flex-shrink: 0; margin-right: 6px; }
.lang { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.percent { margin-left: auto; padding-left: 3px; font: 9px Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
</style>
<div class="progress">{{ progress }}</div>
<ul>{{ lang_list }}</ul>
</div>
</foreignObject>
</svg>
