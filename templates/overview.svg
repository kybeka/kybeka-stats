<svg id="gh-dark-mode-only" width="400" height="340" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">GitHub statistics</title>
<style>
svg { --paper: #fcfafb; --ink: #39323c; --muted: #766e79; --accent: #a97793; --border: #ded5dd; --rule: #eee8ed; }
#gh-dark-mode-only:target { --paper: #211e25; --ink: #eee7ed; --muted: #b5a9b9; --accent: #c399b5; --border: #4a3c4b; --rule: #352d39; }
text { font-family: Arial, sans-serif; }
.ink { fill: var(--ink); }
.muted { fill: var(--muted); }
.heading { font: 600 17px Helvetica, Arial, sans-serif; }
.value { font: 500 17px Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
</style>
<rect x="6" y="6" width="388" height="328" rx="6" fill="var(--paper)" stroke="var(--border)"/>
<text x="26" y="52" class="heading ink">github stats</text>
<path d="M359 28h4v4h4v4h-4v4h-4v-4h-4v-4h4z" fill="var(--accent)"/>
<text x="26" y="107" font-size="12" class="muted">Stars</text>
<text x="374" y="108" text-anchor="end" class="value ink">{{ stars }}</text>
<path d="M26 123h348" stroke="var(--rule)"/>
<text x="26" y="146" font-size="12" class="muted">Forks</text>
<text x="374" y="147" text-anchor="end" class="value ink">{{ forks }}</text>
<path d="M26 162h348" stroke="var(--rule)"/>
<text x="26" y="185" font-size="12" class="muted">All-time contributions</text>
<text x="374" y="186" text-anchor="end" class="value ink">{{ contributions }}</text>
<path d="M26 201h348" stroke="var(--rule)"/>
<text x="26" y="224" font-size="12" class="muted">Lines of code changed</text>
<text x="374" y="225" text-anchor="end" class="value ink">{{ lines_changed }}</text>
<path d="M26 240h348" stroke="var(--rule)"/>
<text x="26" y="263" font-size="12" class="muted">Views · past two weeks</text>
<text x="374" y="264" text-anchor="end" class="value ink">{{ views }}</text>
<path d="M26 279h348" stroke="var(--rule)"/>
<text x="26" y="302" font-size="12" class="muted">Repositories contributed to</text>
<text x="374" y="303" text-anchor="end" class="value ink">{{ repos }}</text>
</svg>
